<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;600&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--mr:#922D2D;--rd:#D93632;--cr:#F0E6D6;--pw:#FAF7F0;--ch:#252525;--gd:#B99A68;--gy:#77716B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth;height:100%}body{margin:0;background:var(--mr);color:var(--ch);font:16px/1.65 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;line-height:1.1;margin:0 0 .5em}h1{font-size:clamp(2.6rem,9vw,6rem);font-weight:900}h2{font-size:clamp(1.8rem,5vw,3rem)}
.q{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:1.4rem;color:var(--mr)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--mr);border-bottom:1px solid var(--gd);display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--cr)}
nav b{font-family:'Playfair Display',serif;letter-spacing:.08em;font-size:.95rem;white-space:nowrap}
#links{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}#links a{color:var(--cr);text-decoration:none;font-size:.78rem;padding:5px 8px;border-bottom:2px solid transparent}#links a.on,#links a:hover{border-color:var(--gd)}
#burger{display:none;margin-left:auto;background:none;border:1px solid var(--gd);color:var(--cr);padding:6px 10px;border-radius:4px}
@media(max-width:1000px){#burger{display:block}#links{display:none;position:absolute;top:100%;left:0;right:0;background:var(--mr);flex-direction:column;padding:8px 16px}#links.open{display:flex}}
main{max-width:1100px;margin:0 auto;padding:20px 14px}
.paper{background:var(--cr);background-image:radial-gradient(#0000000a 1px,transparent 1px);background-size:5px 5px;padding:clamp(20px,5vw,56px);box-shadow:0 8px 30px #0005;border:1px solid var(--gd);position:relative;clip-path:polygon(0 1%,6% 0,14% 1.2%,25% 0,38% 1%,52% 0,66% 1.1%,80% 0,92% 1%,100% 0,100% 99%,90% 100%,76% 98.9%,60% 100%,44% 99%,30% 100%,14% 99%,0 100%)}
.paper+.paper{margin-top:24px}.lab{letter-spacing:.25em;font-size:.72rem;color:var(--rd);font-weight:600;text-transform:uppercase}
.big{font-family:'Playfair Display',serif;font-size:clamp(4rem,16vw,10rem);color:#92 2D2D18;color:#922D2D22;font-weight:900;line-height:.8;position:absolute;right:16px;top:20px;pointer-events:none}
.brush{background:linear-gradient(100deg,transparent 0,var(--rd) 3%,var(--mr) 97%,transparent);color:var(--cr);display:inline-block;padding:.05em .3em;transform:rotate(-1.5deg)}
.btn{background:var(--mr);color:var(--cr);border:0;padding:10px 18px;border-radius:3px;font:600 .85rem Inter;cursor:pointer;text-decoration:none;display:inline-block;margin:3px 3px 3px 0}.btn.o{background:none;color:var(--mr);border:1px solid var(--mr)}.btn:hover{filter:brightness(1.15)}.btn.s{padding:5px 10px;font-size:.75rem}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.two{display:grid;gap:24px;grid-template-columns:1fr 1fr}@media(max-width:760px){.two{grid-template-columns:1fr}}
.card{background:var(--pw);border:1px solid var(--gd);padding:16px;box-shadow:0 3px 10px #0002}
.pol{background:#fff;padding:10px 10px 14px;box-shadow:0 4px 14px #0004;transform:rotate(var(--r,0deg));cursor:pointer;transition:.25s;position:relative}.pol:hover{transform:rotate(0) scale(1.03)}
.pol:before{content:"";position:absolute;top:-8px;left:40%;width:70px;height:18px;background:#b99a6877;transform:rotate(-3deg)}
.ph{aspect-ratio:4/3;background:#999;filter:grayscale(1);display:grid;place-items:center;overflow:hidden}.ph svg{width:55%;opacity:.55}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top}.pol h3{font-size:1.05rem;margin:8px 0 0}.pol small{color:var(--gy)}
.stat{text-align:center}.stat b{font:900 2.6rem 'Playfair Display';color:var(--mr);display:block}
.tl{border-left:3px dashed var(--rd);margin-left:10px;padding-left:22px}.tl .e{margin-bottom:26px;position:relative}.tl .e:before{content:"";position:absolute;left:-31px;top:6px;width:14px;height:14px;background:var(--rd);border-radius:50%}
.rv{opacity:0;transform:translateY(20px);transition:.7s}.rv.in{opacity:1;transform:none}
.pl{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:center;margin-bottom:16px}.pl i{font:900 4rem 'Playfair Display';color:var(--rd);font-style:normal}
.badge{background:var(--mr);color:var(--cr);font-size:.7rem;padding:2px 8px;border-radius:10px;display:inline-block}.badge.g{background:var(--gd);color:#000}.sim{border:1px dashed var(--rd);color:var(--rd)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--gd);background:var(--pw);font:inherit;border-radius:3px;margin:3px 0 10px}textarea{min-height:120px}
label{font-size:.78rem;font-weight:600;color:var(--gy)}
table{width:100%;border-collapse:collapse;font-size:.85rem}th,td{padding:8px;border-bottom:1px solid var(--gd);text-align:left}.sc{overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;font:600 .9rem Inter;cursor:pointer}.tabs button.on{border-color:var(--rd);color:var(--rd)}
.flow{display:flex;gap:8px;align-items:center;font-size:.8rem;flex-wrap:wrap;margin:8px 0}.flow span{background:var(--pw);border:1px solid var(--gd);padding:3px 10px}
#modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:50;padding:14px}#modal.on{display:grid}#mb{background:var(--cr);max-width:640px;max-height:88vh;overflow:auto;padding:24px;width:100%;border:1px solid var(--gd)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ch);color:#fff;padding:10px 18px;border-radius:4px;z-index:60;display:none}
.note{font-size:.8rem;color:var(--gy);border-left:3px solid var(--gd);padding-left:10px;margin:10px 0}
footer{background:var(--mr);color:var(--cr);text-align:center;padding:40px 16px;border-top:1px solid var(--gd)}footer a{color:var(--gd);margin:0 6px}
.bar{height:14px;background:var(--rd);margin:4px 0}
#top{position:fixed;right:14px;bottom:14px;z-index:15;display:none}
@media(prefers-color-scheme:dark){.paper{background-color:#e8dcc8}}

async function aesKey(pw,salt){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function aesEnc(t,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await aesKey(pw,salt);const c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(t)));return{ciphertext:b64(c),iv:b64(iv),salt:b64(salt)}}
async function aesDec(o,pw){try{const k=await aesKey(pw,ub(o.salt));return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.iv)},k,ub(o.ciphertext)))}catch(e){throw Error('Dekripsi gagal: password salah atau data rusak')}}
async function run(alg,t,key,dec,pack){ // pack: AES envelope as JSON string
 if(!t)throw Error('Teks kosong');if(!key)throw Error('Kunci/password wajib diisi');
 if(alg==='caesar'){const n=parseInt(key);if(isNaN(n))throw Error('Pergeseran harus angka');return caesar(t,n,dec)}
 if(alg==='vigenere')return vig(t,key,dec);
 if(key.length<8)throw Error('Password AES minimal 8 karakter');
 if(!dec){const o=await aesEnc(t,key);return JSON.stringify(o)}
 let o;try{o=JSON.parse(t)}catch(e){throw Error('Format ciphertext AES tidak valid (JSON)')}return aesDec(o,key)}

P.sejarah=()=>sec('Sejarah','THE HISTORY OF YOUTH PLEDGE',`<div class="two"><div><h3>Masa kolonial</h3><p>Pada awal abad ke-20 Hindia Belanda berada di bawah pemerintahan kolonial. Hak politik rakyat terbatas dan perlawanan bersenjata yang bersifat lokal tidak mampu mengalahkan kekuasaan kolonial.</p><h3>Perjuangan kedaerahan</h3><p>Organisasi pemuda awal seperti Jong Java, Jong Sumatranen Bond, Jong Ambon, dan Jong Celebes berbasis daerah atau suku, sehingga perjuangan masih terpecah.</p><h3>Pendidikan &amp; kesadaran nasional</h3><p>Perluasan pendidikan modern melahirkan kaum terpelajar yang mulai memikirkan identitas bersama, ditopang berdirinya Budi Utomo (1908) dan organisasi pergerakan lain.</p></div><div><h3>Kebutuhan persatuan</h3><p>Para pemuda menyadari bahwa perjuangan akan lebih kuat bila disatukan lintas daerah.</p><h3>Kongres Pemuda I (1926)</h3><p>Diselenggarakan di Batavia pada 30 April–2 Mei 1926 sebagai upaya awal menyatukan organisasi pemuda.</p><h3>Kongres Pemuda II (1928)</h3><p>Berlangsung 27–28 Oktober 1928 di Batavia dan menghasilkan rumusan ikrar yang kemudian dikenal sebagai Sumpah Pemuda.</p><p class="q">"Persatuan adalah fondasi bangsa."<br><small>(kutipan editorial situs ini, bukan kutipan tokoh)</small></p></div></div>`,'1908–28');

let ealg='aes',etab='enc';
const INFO={caesar:'Caesar Cipher & Vigenère adalah algoritma KLASIK untuk pembelajaran, bukan keamanan modern. Kunci: angka pergeseran.',vigenere:'Algoritma klasik untuk pembelajaran, bukan keamanan modern. Kunci: kata (huruf).',aes:'AES-256-GCM via Web Crypto; PBKDF2-SHA256 600.000 iterasi; salt & IV acak. Output JSON berisi salt, iv, ciphertext. Password tidak disimpan.'};
P.enkripsi=()=>`<section class="paper"><div class="lab">Cryptography</div><h2>ENCRYPTED MESSAGE DISPATCHER</h2><p class="q">Protecting Historical Correspondence Through Digital Cryptography.</p>

function info(){$('#inf').textContent=INFO[ealg];$('#kl').textContent=ealg==='caesar'?'Nilai pergeseran (angka)':ealg==='vigenere'?'Kata kunci':'Password (min. 8 karakter)';$('#ek').type=ealg==='aes'?'password':'text'}

window.doIt=async()=>{const dec=etab==='dec';$('#st').textContent='Memproses…';try{const out=await run(ealg,dec?$('#ct').value.trim():$('#pt').value,$('#ek').value,dec);$(dec?'#pt':'#ct').value=out;log(ealg,dec?'decrypt':'encrypt','sukses');$('#st').textContent='Berhasil';toast('Berhasil')}catch(e){log(ealg,dec?'decrypt':'encrypt','gagal');$('#st').textContent='Gagal';toast(e.message)}hist()};

P.surat=()=>`<section class="paper"><div class="lab">Correspondence</div><h2>SECRET HISTORICAL CORRESPONDENCE</h2><div class="note">Surat di bawah dibuat pengguna/fiktif — bukan dokumen sejarah asli. Hanya ciphertext yang disimpan; plaintext tidak disimpan.</div>

window.ltr=async enc=>{const s=$('#ls').value.trim(),r=$('#lr').value.trim(),j=$('#lj').value.trim(),b=$('#lb').value,a=$('#la').value;if(!s||!r||!j||!b)return toast('Lengkapi semua kolom');
let l={sender:s,receiver:r,subject:j,algorithm:a,status:'Draft',ciphertext:'',iv:'',salt:'',created:new Date().toISOString()};
if(enc){try{const o=await run(a,b,$('#lk').value,false);if(a==='aes'){const p=JSON.parse(o);Object.assign(l,{ciphertext:p.ciphertext,iv:p.iv,salt:p.salt})}else l.ciphertext=o;l.status='Encrypted';log(a,'encrypt surat','sukses')}catch(e){log(a,'encrypt surat','gagal');return toast(e.message)}}else{l.ciphertext=btoa(unescape(encodeURIComponent(b)));l.status='Draft';l.draft=1}
letters.unshift(l);DB.set('letters',letters);$('#lb').value=$('#lk').value='';drawL();toast(enc?'Terenkripsi & tersimpan':'Draft disimpan (belum terenkripsi!)')};

window.ldec=async i=>{const l=letters[i];try{const t=l.algorithm==='aes'?JSON.stringify({ciphertext:l.ciphertext,iv:l.iv,salt:l.salt}):l.ciphertext;const o=await run(l.algorithm,t,$('#dk').value,true);$('#dr').textContent=o;l.status='Decrypted';DB.set('letters',letters);log(l.algorithm,'decrypt surat','sukses');drawL()}catch(e){log(l.algorithm,'decrypt surat','gagal');$('#dr').textContent=e.message}};

P.galeri=()=>sec('Gallery','HISTORICAL VISUAL ARCHIVES',`<select onchange="gc=this.value;gal()"><option value="">Semua kategori</option>${GAL.map(g=>`<option>${g[0]}</option>`).join('')}</select><div class="note">Placeholder visual: situs ini tidak menyertakan foto berhak cipta. Unggah foto resmi dari ANRI/Perpusnas/Museum Sumpah Pemuda dan cantumkan sumbernya.</div><div class="grid" id="gg"></div>`);
P._galeri=()=>gal();
function gal(){$('#gg').innerHTML=GAL.map((g,i)=>[g,i]).filter(x=>!gc||x[0][0]===gc).map(([g,i])=>`<div class="pol" style="--r:${(i%4-1.5)*2}deg" onclick="glb(${i})">${PH(g[3])}<h3>${g[0]}</h3><small>${g[1]} · ${g[2]}</small></div>`).join('')}
window.glb=i=>{const g=GAL[i];modal(`${PH(g[3])}<h2>${g[0]} (${g[1]})</h2><p>${g[2]}</p><p class="note">Sumber foto: ${g[3]?'unggahan pengguna, verifikasi sumber &amp; lisensi':'placeholder'}.</p>`)};
P.tentang=()=>sec('Tentang Kami','TENTANG PROYEK',`<p>Historical Archives adalah proyek edukasi RPL: arsip digital dan pengirim pesan terenkripsi bertema Sumpah Pemuda 1928.</p><p><b>Batasan versi demo:</b> aplikasi berjalan sepenuhnya di browser (single-file HTML, tanpa server). Data tersimpan di localStorage perangkat Anda, bukan database MySQL/PostgreSQL. Login admin hanya pembatas antarmuka dan <u>bukan</u> autentikasi aman. Enkripsi AES berjalan nyata di browser, tetapi aplikasi ini tidak boleh dianggap aman sepenuhnya untuk data sensitif.</p><p>Sumber rujukan: ANRI, Kemendikbud, Museum Sumpah Pemuda, Perpusnas.</p>`);
/* ADMIN */
const HASH='aa7a1d8c52e1b1ab8d8c7a21a7b0e0aeb2cc3b0a2a3a59e84a6bbf4d2d3cc7f6';
P.admin=()=>{if(!adm)return `<section class="paper"><h2>ADMIN LOGIN</h2><div class="note">Mode demo: bukan autentikasi aman. Kata sandi demo: <b>admin1928</b>.</div><label>Password</label><input id="ap" type="password"><button class="btn" onclick="login()">Masuk</button></section>`;
const by=CAT.map(c=>[c,docs.filter(d=>d.cat===c).length]),mx=Math.max(1,...by.map(x=>x[1]));
return `<section class="paper"><div class="lab">Dashboard</div><h2>OVERVIEW</h2><div class="grid"><div class="stat"><b>${docs.length}</b>Dokumen</div><div class="stat"><b>${FIG.length}</b>Tokoh</div><div class="stat"><b>${letters.length}</b>Surat</div><div class="stat"><b>${logs.filter(l=>/crypt/.test(l.o)).length}</b>Operasi enkripsi</div></div>
<h3 style="margin-top:20px">Dokumen per kategori</h3>${by.map(x=>`<div><small>${x[0]} (${x[1]})</small><div class="bar" style="width:${x[1]/mx*100}%;min-width:4px"></div></div>`).join('')}
<div class="two" style="margin-top:20px"><div><h3>Manage Documents</h3><a class="btn" href="#arsip">Buka Arsip (CRUD)</a></div><div><h3>Manage Letters</h3><a class="btn" href="#surat">Buka Surat</a></div></div>
<h3 style="margin-top:20px">Activity logs</h3><div class="sc"><table><tr><th>Waktu</th><th>Algoritma</th><th>Operasi</th><th>Status</th></tr>${logs.slice(0,15).map(l=>`<tr><td>${esc(l.t)}</td><td>${esc(l.a)}</td><td>${esc(l.o)}</td><td>${esc(l.s)}</td></tr>`).join('')}</table></div>
<button class="btn o" onclick="if(confirm('Reset semua data lokal?')){localStorage.clear();location.reload()}">Reset data</button><button class="btn o" onclick="sessionStorage.clear();adm=false;nav()">Logout</button></section>`};
window.login=async()=>{if($('#ap').value==='admin1928'){adm=true;sessionStorage.setItem('adm','1');nav();toast('Login demo berhasil')}else toast('Password salah')};
nav();
</script></body></html>
